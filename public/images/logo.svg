<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 15 480 170" role="img" aria-labelledby="title desc">
  <title id="title">SkillKwiz brand logo</title>
  <desc id="desc">Four-color overlapping icon with SkillKwiz wordmark and tagline.</desc>

  <!-- White background with rounded corners -->
  <rect x="0" y="15" width="480" height="170" rx="16" ry="16" fill="#ffffff"/>

  <!-- Icon group -->
  <g transform="translate(28 34)" opacity="1">
    <rect x="8" y="78" width="96" height="38" rx="19" ry="19" transform="rotate(-45 56 97)" fill="#ff9d00"/>
    <rect x="44" y="44" width="96" height="38" rx="19" ry="19" transform="rotate(-45 92 63)" fill="#48caed"/>
    <rect x="28" y="50" width="96" height="38" rx="19" ry="19" transform="rotate(-45 76 69)" fill="#f73c5c"/>
    <rect x="40" y="62" width="96" height="38" rx="19" ry="19" transform="rotate(-45 88 81)" fill="#2a8bea"/>
  </g>

  <!-- Wordmark -->
  <text x="195" y="116" fill="#69226F" font-size="36" font-family="Aardvark Cafe, 'Aardvark Cafe', Georgia, serif" font-weight="700" letter-spacing="0.5">
    SkillKwiz
  </text>

  <!-- Tagline -->
  <text x="195" y="160" fill="#000000" font-size="23.5" font-family="GardensC, 'GardensC', 'Times New Roman', serif" font-weight="400">
    How much do you know ?
  </text>
</svg>
